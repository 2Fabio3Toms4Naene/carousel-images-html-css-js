<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carousel images created with HTML, CSS and JavaScript</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Image Carousel</h1>
    <div class="carousel">
      <button class="button-prev">
        <img
          src="./images/awrrow-left.svg"
          alt="arrow left"
          class="arrow-left"
        />
      </button>
      <div class="carousel-images">
        <img src="./images/bebidas.jpeg" alt="Image 1" class="slide active" />
        <img src="./images/Bebidas.webp" alt="Image 2" class="slide" />
        <img
          src="./images/BebidasComSaborDeBengalaDoce.webp"
          alt="Image 3"
          class="slide"
        />
        <img src="./images/bolos.jpeg" alt="Image 4" class="slide" />
        <img src="./images/carne.jpeg" alt="Image 5" class="slide" />
        <img src="./images/CarneAdovada.webp" alt="Image 6" class="slide" />
        <img
          src="./images/CarneAsadaMarinade.webp"
          alt="Image 7"
          class="slide"
        />
      </div>
      <button class="button-next">
        <img
          src="./images/arrow-right.svg"
          alt="arrow right"
          class="arrow-right"
        />
      </button>
      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <script src="./index.js" defer></script>
  </body>
</html>
